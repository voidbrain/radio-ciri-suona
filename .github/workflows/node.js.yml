name: Build Angular

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Prepare www
        run: |
          rm -rf www
          mkdir -p www
          cp -R dist/* www/

      - name: Upload www
        uses: actions/upload-artifact@v4
        with:
          name: www
          path: www/
