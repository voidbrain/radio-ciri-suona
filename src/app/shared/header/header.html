<ion-header>
  <ion-toolbar class="app-toolbar">

    @if (backButton() === true) {
      <ion-buttons slot="start">
        <ion-button [routerLink]="['/']" slot="start">Back</ion-button>
      </ion-buttons>
    }

    <div class="header-content" slot="end">
      <div class="header-title">
        {{ title() }}
      </div>

      <img class="logo" src="./assets/icon/logo.png" />
    </div>

  </ion-toolbar>
</ion-header>
